# Workflow name
name: Build Release

# When it will be triggered
on:
  push:
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Where it will run
jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-android
        with:
          signing-key: ${{ secrets.SIGNING_KEY }}
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.SIGNING_ALIAS }}

      - name: Create release build
        run: ./gradlew app:bundleRelease app:assembleRelease

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: Builds
          path: |
            app/build/outputs/apk/release/**/*.apk

  changelog:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8

      - name: Find previous release tag
        id: previous-tag
        env:
          CURRENT_TAG: ${{ github.ref_name }}
        run: |
          previous_tag=""
          while read -r tag; do
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || continue
            [[ "$tag" == "$CURRENT_TAG" ]] && continue

            # Stable releases should start at the previous stable release.
            if [[ "$CURRENT_TAG" == *-* || "$tag" != *-* ]]; then
              previous_tag="$tag"
              break
            fi
          done < <(git tag --merged "$CURRENT_TAG" --sort=-version:refname)

          echo "tag=$previous_tag" >> "$GITHUB_OUTPUT"

      - name: Update CHANGELOG
        id: changelog
        uses: requarks/changelog-action@b78a3354a01f4a1affb484b9264b506a815c46b1 # v1.10.3
        with:
          token: ${{ github.token }}
          fromTag: ${{ github.ref_name }}
          toTag: ${{ steps.previous-tag.outputs.tag }}
          excludeScopes: deps,release,ci,docs,tests,examples,build,devops,infra,workflow

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          make_latest: true
          body: ${{ steps.changelog.outputs.changes }}
          token: ${{ github.token }}
          files: |
            **/*.apk
