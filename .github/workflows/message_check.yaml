name: Check Messages

permissions:
  contents: read

on:
  pull_request:
    branches:
      - master
    types: [ opened, edited, reopened, synchronize ]

jobs:
  validate:
    name: Validate commit and pull request messages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\((app|data|domain|presentation|build|repo|deps|ci|release|docs|auth)\))?!?: [a-z][^[:space:]].*[^.]$'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "Invalid pull request title: $PR_TITLE"
            echo 'Expected: <type>(<optional-scope>): <imperative description>'
            exit 1
          fi

      - name: Validate commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\((app|data|domain|presentation|build|repo|deps|ci|release|docs|auth)\))?!?: [a-z][^[:space:]].*[^.]$'
          invalid=0
          while IFS= read -r subject; do
            if [[ ! "$subject" =~ $pattern ]]; then
              echo "Invalid commit subject: $subject"
              invalid=1
            fi
          done < <(git log --format=%s --no-merges "$BASE_SHA..$HEAD_SHA")

          if [[ "$invalid" -ne 0 ]]; then
            echo 'Commit subjects must use Conventional Commits.'
            exit 1
          fi

      - name: Validate pull request description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          awk '
            function fail(message) {
              print message > "/dev/stderr"
              failed = 1
              exit 1
            }
            /^##[[:space:]]+Summary[[:space:]]*$/ {
              if (section != "") fail("Summary must be the first section.")
              section = "summary"
              next
            }
            /^##[[:space:]]+Changes[[:space:]]*$/ {
              if (section != "summary") fail("Changes must immediately follow Summary.")
              section = "changes"
              next
            }
            /^##[[:space:]]/ { fail("Only Summary and Changes sections are allowed.") }
            /^[[:space:]]*-[[:space:]]+[^[:space:]]/ {
              if (section == "summary") summary_bullets++
              if (section == "changes") changes_bullets++
            }
            END {
              if (failed) exit 1
              if (section != "changes") fail("Description must contain Summary and Changes sections.")
              if (summary_bullets < 1) fail("Summary must contain at least one bullet.")
              if (changes_bullets < 1) fail("Changes must contain at least one bullet.")
            }
          ' <<< "$PR_BODY"